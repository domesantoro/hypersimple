<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hypersimple Board</title>
    <link rel="stylesheet" href="style/login.css?v=7">
</head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script/l10n/hys_en.js?v=7"></script>
<script src="script/l10n/hys_it.js?v=7"></script>
<script src="script/login.js?v=7"></script>
<body>
    <main class="login-page">
        <section class="login-card">
            <h1 id="login_title"></h1>
            <form id="login_form">
                <label for="email" id="login_email_label"></label>
                <input id="email" name="email" type="email" autocomplete="username" required>

                <label for="password" id="login_password_label"></label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit" id="login_button"></button>
                <p id="login_error" class="login-error" hidden></p>
            </form>

            <button type="button" id="login_about_toggle" class="about-toggle"></button>
            <div id="login_disclaimer" class="login-disclaimer" hidden></div>
        </section>
    </main>
</body>
</html>
